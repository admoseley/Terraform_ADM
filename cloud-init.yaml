#cloud-config
package_update: true
package_upgrade: false

packages:
  - nginx

write_files:
  - path: /var/www/html/index.html
    permissions: '0644'
    content: |
      <!doctype html>
      <html>
        <head><title>Moseley Development</title></head>
        <body>
          <h1>Moseley Development webserver</h1>
          <p>Provisioned with Terraform on Debian 12.</p>
        </body>
      </html>

runcmd:
  - systemctl enable nginx
  - systemctl restart nginx
