# ---------------------------------------------------------------------------
# Terraform CI — runs on every pull request into main.
#
# This is the "scan for correctness and security" half of the workflow. It does
# NOT touch Azure (no cloud credentials required) — it only checks the code:
#   - fmt      : formatting is consistent
#   - init     : providers/modules resolve (backend disabled, no cloud calls)
#   - validate : configuration is internally valid
#   - tflint   : lint + best-practice rules
#   - checkov  : IaC security scanning against Azure policies
#
# GitHub Copilot code review runs separately as an automatic PR reviewer
# (configured via repository ruleset, not here).
# ---------------------------------------------------------------------------
name: Terraform CI

on:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same PR to save minutes.
concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      # backend=false keeps init from reaching Azure — pure config resolution.
      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: TFLint
        run: |
          tflint --init
          tflint --recursive --format compact

  security:
    name: Checkov Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Scans all Terraform for Azure security misconfigurations.
      #
      # ROLLOUT: soft_fail is TRUE for now (report-only) so we can establish a
      # baseline without blocking the pipeline's own introduction. Findings are
      # tracked as follow-up issues; once addressed, flip soft_fail to false to
      # make security failures block merges. Suppress an accepted finding inline
      # with `# checkov:skip=CKV_AZURE_XXX: <reason>`.
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: true
          output_format: cli
          download_external_modules: false
