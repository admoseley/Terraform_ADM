# ---------------------------------------------------------------------------
# Terraform CI — runs on every pull request into main.
#
# This is the "scan for correctness and security" half of the workflow. It does
# NOT touch Azure (no cloud credentials required) — it only checks the code:
#   - fmt      : formatting is consistent
#   - init     : providers/modules resolve (backend disabled, no cloud calls)
#   - validate : configuration is internally valid
#   - tflint   : lint + best-practice rules
#   - checkov  : IaC security scanning against Azure policies
#
# GitHub Copilot code review runs separately as an automatic PR reviewer
# (configured via repository ruleset, not here).
# ---------------------------------------------------------------------------
name: Terraform CI

on:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same PR to save minutes.
concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      # backend=false keeps init from reaching Azure — pure config resolution.
      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: TFLint
        run: |
          tflint --init
          tflint --recursive --format compact

  security:
    name: Checkov Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Scans all Terraform for Azure security misconfigurations.
      #
      # ENFORCING: soft_fail is false, so any unresolved finding blocks the PR.
      # The baseline has been cleared — real issues fixed, and the two
      # deliberate findings (HTTP :80, public IP for Traffic Manager) suppressed
      # inline with justifications. Suppress a newly-accepted finding with
      # `# checkov:skip=CKV_AZURE_XXX: <reason>` inside the resource block.
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: false
          output_format: cli
          download_external_modules: false
